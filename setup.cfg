[metadata]
name = lanmouse-suite
version = 0.1.0
description = Trusted-LAN orchestration, UI, and clipboard companion for Lan Mouse
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE
author = Lan Mouse Suite contributors
url = https://github.com/DHowDev/lan-mouse-suite
project_urls =
    Source = https://github.com/DHowDev/lan-mouse-suite
    Issues = https://github.com/DHowDev/lan-mouse-suite/issues
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    Operating System :: MacOS
    Operating System :: Microsoft :: Windows
    Operating System :: POSIX :: Linux

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    lanmouse-suite = lanmouse_suite.cli:main
    lanmouse-suite-gui = lanmouse_suite.gui:main
